name: VPN Key Checker (GitHub)

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-keys:
    runs-on: windows-latest

    steps:
      - name: Скачиваем код из репозитория
        uses: actions/checkout@v4

      - name: Скачиваем ключи из секрета
        shell: pwsh
        run: |
          $sources = "${{ secrets.KEY_SOURCES }}".Trim() -split '\s+'
          foreach ($url in $sources) {
            if ($url -ne "") {
              Write-Host "Скачиваем: $url"
              Invoke-WebRequest -Uri $url -OutFile "temp_keys.txt"
              Get-Content "temp_keys.txt" | Add-Content -Path "keys.txt"
            }
          }
          Remove-Item "temp_keys.txt" -ErrorAction SilentlyContinue

      - name: Скачиваем Xray и Sing-box
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force
          
          Invoke-WebRequest -Uri "https://github.com/SagerNet/sing-box/releases/download/v1.14.4/sing-box-1.14.4-windows-amd64.zip" -OutFile "singbox.zip"
          Expand-Archive -Path "singbox.zip" -DestinationPath "temp_singbox" -Force
          
          Get-ChildItem -Path "temp_singbox" -Filter "sing-box.exe" -Recurse | Move-Item -Destination ".\sing-box.exe" -Force
          
          Remove-Item -Path "xray.zip", "singbox.zip" -Force
          Remove-Item -Path "temp_singbox" -Recurse -Force

      - name: Устанавливаем Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Кэшируем Cargo
        uses: Swatinem/rust-cache@v2

      - name: Собираем проект
        run: cargo build --release

      - name: Запускаем чекер
        continue-on-error: true
        run: .\target\release\vpn-key-checker.exe

      - name: Сохраняем результат (GitHub)
        shell: pwsh
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Переименовываем файл под GitHub
          if (Test-Path "alive_keys.txt") {
            Rename-Item -Path "alive_keys.txt" -NewName "alive_keys_github.txt"
            git add -f alive_keys_github.txt
            
            if (git diff --staged --quiet) {
              Write-Host "Нет новых ключей."
            } else {
              git commit -m "Auto-update: GitHub keys [skip ci]"
              git push
            }
          } else {
             Write-Host "Файл alive_keys.txt не был создан."
          }
