[package]
name = "vpn-key-checker"
version = "0.1.0"
edition = "2021"
description = "Fast asynchronous VPN key checker powered by Xray and sing-box"

[dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["socks", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
anyhow = "1"
url = "2"
rand = "0.8"
percent-encoding = "2"
